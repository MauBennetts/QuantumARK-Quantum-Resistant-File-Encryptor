[package]
name = "blackprism-tauri"
version = "4.0.0"
edition = "2021"

[dependencies]
# Criptografía
ml-kem = "0.3"
hybrid-array = "0.4"
pqcrypto-dilithium = "0.5.0"
pqcrypto-traits = "0.3.5"
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
hkdf = "0.12.4"
sha3 = "0.10.8"
sha2 = "0.10.8"
blake3 = "1.5.1"
rand = "0.8.5"
rand_core_10 = { version = "0.10", package = "rand_core" }
sharks = "0.5"
reed-solomon-erasure = "6"
machine-uid = "0.5"

# Seguridad de memoria — limpieza automática de secretos en RAM
zeroize = { version = "1.7", features = ["derive"] }

# Serialización y utilidades
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
hex = "0.4.3"

# Tauri (GUI Framework)
tauri = { version = "2.0.0", features = [] }
tauri-build = "2.0.0"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
