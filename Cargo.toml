[package]
name = "quantumark-tauri"
version = "3.0.0"
edition = "2021"

[dependencies]
# Criptografía
pqcrypto-kyber = "0.8.0"
pqcrypto-dilithium = "0.5.0"
pqcrypto-traits = "0.3.5"
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
hkdf = "0.12.4"
sha3 = "0.10.8"
rand = "0.8.5"

# Serialización y utilidades
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
hex = "0.4.3"

# Tauri (GUI Framework)
tauri = { version = "2.0.0", features = [] }
tauri-build = "2.0.0"

[build-dependencies]
tauri-build = "2.0.0"
